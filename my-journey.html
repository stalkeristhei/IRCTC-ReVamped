<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRCTC — My Journey</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main class="page-wrapper">
    <div class="page-header">
      <h1>My journey</h1>
      <p class="subtitle">Everything important, in one place.</p>
    </div>

    <section class="journey-panel glass-panel">
      <span class="confirmed-badge">BOOKING CONFIRMED</span>
      <p class="pnr-line">
        PNR <strong>6427891031</strong> • 12652
        <a href="#" class="btn-download">DOWNLOAD TICKET</a>
      </p>

      <h3 style="font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;">Journey timeline</h3>
      <div class="timeline">
        <div class="timeline-step">
          <div class="dot"></div>
          <div class="step-label">Booked</div>
          <div class="step-date">Today</div>
        </div>
        <div class="timeline-step">
          <div class="dot"></div>
          <div class="step-label">Reminder</div>
          <div class="step-date">24 Aug</div>
        </div>
        <div class="timeline-step">
          <div class="dot"></div>
          <div class="step-label">Departure</div>
          <div class="step-date">25 Aug</div>
        </div>
        <div class="timeline-step">
          <div class="dot"></div>
          <div class="step-label">Arrival</div>
          <div class="step-date">26 Aug</div>
        </div>
      </div>

      <a href="#" class="btn-secondary">VIEW PNR DETAILS</a>

      <div class="live-status-box">
        <h3>Live status</h3>
        <div class="live-status-grid">
          <p><strong>Status</strong> ON TIME</p>
          <p><strong>Platform</strong> 5</p>
          <p><strong>Coach</strong> S3 • Berth 42</p>
          <p><strong>Next stop</strong> Jhansi</p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
