<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRCTC — Get Help</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="help">
  <header id="site-header"></header>

  <main class="page-wrapper">
    <div class="page-header">
      <h1>Get help <span class="demo-badge">Demo AI</span></h1>
      <p class="subtitle">Find the right help for your issue — powered by a dummy assistant for now.</p>
    </div>

    <section class="help-panel glass-panel">
      <div class="help-header">
        <h2>IRCTC Help Assistant</h2>
        <p>Ask about PNR, refunds, delays, cancellations, or booking issues.</p>
      </div>
      <div class="help-messages" id="help-messages"></div>
      <form class="help-form" id="help-form">
        <input class="field-input" type="text" id="help-input" placeholder="Type your question…" autocomplete="off" required>
        <button type="submit" class="btn-primary">SEND</button>
      </form>
    </section>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
